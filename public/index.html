<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGA TV</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="page-wrapper">

    <!-- Top green banner -->
    <div class="top-banner" id="top-banner"></div>

    <!-- Main card -->
    <main class="card">

      <!-- Logo -->
      <div class="logo-container">
        <img id="profile-logo" src="/logo1.png" alt="AGA TV Logo" />
      </div>

      <!-- Name -->
      <h1 class="profile-name" id="profile-name">AGA TV</h1>

      <!-- Platforms section -->
      <section class="platforms-section">
        <p class="find-me">Find me on</p>
        <ul class="platform-list" id="platform-list">
          <!-- Injected by app.js -->
        </ul>
      </section>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
